<!doctype html><html><head><title>Shop</title></head><body>
<h1>Checkout</h1>
<form id="f"><label>Email <input id="email" type="email" placeholder="you@example.com"></label>
<button id="pay" type="button" onclick="doPay()">Pay now</button></form>
<p id="status">Ready</p>
<script>
function doPay(){
  console.error('Payment widget failed to initialise');
  fetch('https://shop.test/api/charge',{method:'POST'}).then(r=>{document.getElementById('status').textContent='Error '+r.status});
}
</script></body></html>
